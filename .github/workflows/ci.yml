name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EasiLoginer.sln

      - name: Build
        run: dotnet build EasiLoginer.sln -c Release --no-restore

      - name: Test
        run: dotnet test EasiLoginer.sln -c Release --no-build --logger "console;verbosity=minimal"
